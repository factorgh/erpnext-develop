name: Build image and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Hostinger secrets
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          HOSTINGER_VM_ID: ${{ vars.HOSTINGER_VM_ID }}
        run: |
          if [ -z "$HOSTINGER_API_KEY" ] || [ -z "$HOSTINGER_VM_ID" ]; then
            echo "Add GitHub Actions secret HOSTINGER_API_KEY and variable HOSTINGER_VM_ID (2101603)."
            echo "Until then the image is still published to GHCR; Hostinger will not auto-redeploy."
            exit 1
          fi

      - name: Pin compose to this commit's image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path
          img = os.environ["IMAGE"]
          path = Path("docker-compose.yml")
          text = path.read_text()
          text = text.replace(
              "${ERPNEXT_IMAGE:-ghcr.io/factorgh/erpnext-develop:latest}",
              img,
          )
          path.write_text(text)
          print("Pinned image to", img)
          PY

      - name: Deploy compose to Hostinger Docker Manager
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: stackerp
          docker-compose-path: docker-compose.yml
          environment-variables: |
            ERPNEXT_IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
