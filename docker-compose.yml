# Hostinger Docker Manager + GitHub Actions.
# Push to main builds ghcr.io/factorgh/erpnext-develop and redeploys this stack.
# First login: Administrator / admin — change this password immediately.

services:
  backend:
    image: ${ERPNEXT_IMAGE:-ghcr.io/factorgh/erpnext-develop:latest}
    pull_policy: always
    restart: unless-stopped
    networks:
      - frappe_network
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    image: ${ERPNEXT_IMAGE:-ghcr.io/factorgh/erpnext-develop:latest}
    pull_policy: always
    restart: "no"
    networks:
      - frappe_network
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        if [ -d sites/frontend ]; then
          bench --site frontend set-config host_name "https://ledstackerp.com";
          bench --site frontend migrate || true;
          bench --site frontend install-app erpnext || true;
          bench --site frontend execute "frappe.db.set_single_value('Website Settings', 'app_logo', '/assets/erpnext/images/erpnext-logo.png')" || true;
          bench --site frontend execute "frappe.db.set_single_value('Website Settings', 'splash_image', '/assets/erpnext/images/erpnext-logo.png')" || true;
          bench --site frontend execute "frappe.db.set_single_value('Website Settings', 'favicon', '/assets/erpnext/images/erpnext-logo.png')" || true;
          bench --site frontend execute "frappe.db.set_single_value('Website Settings', 'app_name', 'LedstackERP')" || true;
          bench --site frontend execute "frappe.db.set_single_value('System Settings', 'app_name', 'LedstackERP')" || true;
          bench --site frontend clear-cache || true;
        fi;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: ${ERPNEXT_IMAGE:-ghcr.io/factorgh/erpnext-develop:latest}
    pull_policy: always
    restart: "no"
    networks:
      - frappe_network
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] &&
        [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] &&
        [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/frontend" ]; then
          echo "Site frontend already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=admin --db-root-username=root --db-root-password=admin --install-app erpnext --set-default frontend;
        fi;

  db:
    image: mariadb:11.8
    restart: unless-stopped
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: ${ERPNEXT_IMAGE:-ghcr.io/factorgh/erpnext-develop:latest}
    pull_policy: always
    restart: unless-stopped
    networks:
      - frappe_network
      - traefik-proxy
    depends_on:
      - websocket
      - backend
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "8080:8080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.stackerp.rule=Host(`ledstackerp.com`) || Host(`www.ledstackerp.com`)
      - traefik.http.routers.stackerp.entrypoints=websecure
      - traefik.http.routers.stackerp.tls.certresolver=letsencrypt
      - traefik.http.services.stackerp.loadbalancer.server.port=8080

  queue-long:
    image: ${ERPNEXT_IMAGE:-ghcr.io/factorgh/erpnext-develop:latest}
    pull_policy: always
    restart: unless-stopped
    networks:
      - frappe_network
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: ${ERPNEXT_IMAGE:-ghcr.io/factorgh/erpnext-develop:latest}
    pull_policy: always
    restart: unless-stopped
    networks:
      - frappe_network
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks:
      - frappe_network
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks:
      - frappe_network

  scheduler:
    image: ${ERPNEXT_IMAGE:-ghcr.io/factorgh/erpnext-develop:latest}
    pull_policy: always
    restart: unless-stopped
    networks:
      - frappe_network
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    image: ${ERPNEXT_IMAGE:-ghcr.io/factorgh/erpnext-develop:latest}
    pull_policy: always
    restart: unless-stopped
    networks:
      - frappe_network
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
  traefik-proxy:
    external: true
